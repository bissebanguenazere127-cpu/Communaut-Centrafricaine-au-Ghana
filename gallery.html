<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Galerie de la </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #faf9f6;
      --text: #171717;
      --muted: #777;
      --card: #ffffff;
      --accent: #a78360;
      --line: #e8e5df;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
    }

    body.no-scroll {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1440px, 92%);
      margin: auto;
    }

    /* NAVIGATION */

    header {
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    nav {
      min-height: 82px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 30px;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .contact-link {
      border: 1px solid var(--text);
      padding: 11px 18px;
      border-radius: 30px;
    }

    /* HERO */

    .hero {
      padding: 100px 0 55px;
      text-align: center;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 22px auto;
      max-width: 900px;
      font-size: clamp(42px, 7vw, 88px);
      line-height: 1.03;
      letter-spacing: -5px;
      font-weight: 600;
    }

    .hero h1 em {
      font-family: Georgia, serif;
      font-weight: 400;
    }

    .hero p {
      max-width: 500px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
    }

    .hero-button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 24px;
      background: var(--text);
      color: white;
      border-radius: 30px;
      font-size: 13px;
      transition: .3s;
    }

    .hero-button:hover {
      background: var(--accent);
      transform: translateY(-3px);
    }

    /* FILTERS */

    .gallery-section {
      padding: 35px 0 100px;
    }

    .gallery-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }

    .gallery-top h2 {
      font-size: 22px;
      letter-spacing: -1px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 9px 17px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 12px;
      transition: .25s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--text);
      border-color: var(--text);
      color: white;
    }

    /* MASONRY GALLERY */

    .gallery {
      columns: 3 280px;
      column-gap: 20px;
    }

    .photo {
      position: relative;
      display: block;
      width: 100%;
      margin-bottom: 20px;
      break-inside: avoid;
      border: none;
      background: #eee;
      border-radius: 5px;
      overflow: hidden;
      cursor: zoom-in;
      text-align: left;
      animation: appear .6s both;
    }

    .photo[hidden] {
      display: none;
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform .7s cubic-bezier(.2,.7,.2,1);
    }

    .photo:hover img {
      transform: scale(1.045);
    }

    .photo::after {
      content: "";
      position: absolute;
      inset: 35% 0 0;
      background: linear-gradient(transparent, rgba(0,0,0,.65));
      opacity: 0;
      transition: .3s;
      pointer-events: none;
    }

    .photo:hover::after,
    .photo:focus-visible::after {
      opacity: 1;
    }

    .photo-info {
      position: absolute;
      z-index: 1;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 22px;
      color: white;
      opacity: 0;
      transform: translateY(8px);
      transition: .3s;
      pointer-events: none;
    }

    .photo:hover .photo-info,
    .photo:focus-visible .photo-info {
      opacity: 1;
      transform: translateY(0);
    }

    .photo-info h3 {
      font-size: 15px;
    }

    .photo-info p {
      font-size: 11px;
      color: #eee;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* LIGHTBOX */

    .lightbox {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(10,10,10,.96);
      padding: 25px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-content {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
    }

    .lightbox img {
      display: block;
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 3px;
    }

    .lightbox-caption {
      color: white;
      text-align: center;
      font-size: 13px;
    }

    .lightbox button {
      position: absolute;
      border: 1px solid #555;
      background: rgba(30,30,30,.8);
      color: white;
      cursor: pointer;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 24px;
      display: grid;
      place-items: center;
    }

    .lightbox button:hover {
      background: var(--accent);
    }

    .close-lightbox {
      top: 20px;
      right: 20px;
    }

    .prev-photo {
      left: 20px;
    }

    .next-photo {
      right: 20px;
    }

    /* ABOUT */

    .about {
      padding: 85px 0;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .about h2 {
      font-size: clamp(30px, 4vw, 48px);
      letter-spacing: -2px;
      margin: 15px 0;
    }

    .about p {
      max-width: 550px;
      margin: auto;
      color: var(--muted);
      font-size: 14px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--line);
      padding: 30px 0;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      color: var(--muted);
      font-size: 12px;
    }

    footer a {
      color: var(--text);
    }

    @media (max-width: 600px) {
      nav {
        min-height: 72px;
      }

      .logo {
        font-size: 18px;
      }

      .nav-links {
        gap: 13px;
        font-size: 11px;
      }

      .nav-links .optional {
        display: none;
      }

      .contact-link {
        padding: 8px 12px;
      }

      .hero {
        padding: 75px 0 40px;
      }

      .hero h1 {
        letter-spacing: -2.5px;
      }

      .hero p {
        font-size: 13px;
      }

      .gallery {
        columns: 2 140px;
        column-gap: 10px;
      }

      .photo {
        margin-bottom: 10px;
      }

      .gallery-top {
        align-items: flex-start;
      }

      .filters {
        gap: 6px;
      }

      .filter-btn {
        padding: 8px 12px;
      }

      .photo-info {
        padding: 10px;
      }

      .photo-info h3 {
        font-size: 12px;
      }

      .lightbox {
        padding: 10px;
      }

      .lightbox img {
        max-width: 96%;
      }

      .prev-photo {
        left: 8px;
      }

      .next-photo {
        right: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <!-- FULLSCREEN LIGHTBOX -->

  <div class="lightbox" id="lightbox"
    role="dialog" aria-modal="true" aria-label="Photo viewer">

    <button class="close-lightbox" id="close-lightbox"
      aria-label="Close photo viewer">×</button>

    <button class="prev-photo" id="prev-photo"
      aria-label="Previous photo">‹</button>

    <div class="lightbox-content">
      <img id="lightbox-image" src="" alt="">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <button class="next-photo" id="next-photo"
      aria-label="Next photo">›</button>
  </div>

  <script>
    const photos = [...document.querySelectorAll('.photo')];
    const filters = [...document.querySelectorAll('.filter-btn')];

    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxCaption = document.getElementById('lightbox-caption');

    let visiblePhotos = [...photos];
    let currentIndex = 0;
    let lastFocusedElement = null;

    document.getElementById('year').textContent =
      new Date().getFullYear();

    function updateCount() {
      document.getElementById('photo-count').textContent =
        `(${visiblePhotos.length})`;
    }

    // CATEGORY FILTERS

    filters.forEach(button => {
      button.addEventListener('click', () => {
        filters.forEach(item => item.classList.remove('active'));
        button.classList.add('active');

        const category = button.dataset.filter;

        photos.forEach(photo => {
          photo.hidden =
            category !== 'all' &&
            photo.dataset.category !== category;
        });

        visiblePhotos = photos.filter(photo => !photo.hidden);
        updateCount();
      });
    });

    // OPEN LIGHTBOX

    function openLightbox(photo) {
      lastFocusedElement = document.activeElement;
      visiblePhotos = photos.filter(photo => !photo.hidden);
      currentIndex = visiblePhotos.indexOf(photo);

      showPhoto(currentIndex);

      lightbox.classList.add('open');
      document.body.classList.add('no-scroll');
      document.getElementById('close-lightbox').focus();
    }

    function showPhoto(index) {
      if (!visiblePhotos.length) return;

      currentIndex =
        (index + visiblePhotos.length) % visiblePhotos.length;

      const photo = visiblePhotos[currentIndex];
      const image = photo.querySelector('img');

      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;

      lightboxCaption.textContent =
        `${photo.dataset.title} — ${photo.dataset.description}`;
    }

    photos.forEach(photo => {
      photo.addEventListener('click', () => openLightbox(photo));
    });

    // CLOSE LIGHTBOX

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.classList.remove('no-scroll');
      lightboxImage.src = '';

      if (lastFocusedElement) lastFocusedElement.focus();
    }

    document.getElementById('close-lightbox')
      .addEventListener('click', closeLightbox);

    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeLightbox();
    });

    // PREVIOUS AND NEXT

    document.getElementById('prev-photo')
      .addEventListener('click', () => showPhoto(currentIndex - 1));

    document.getElementById('next-photo')
      .addEventListener('click', () => showPhoto(currentIndex + 1));

    // KEYBOARD SUPPORT

    document.addEventListener('keydown', event => {
      if (!lightbox.classList.contains('open')) return;

      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') showPhoto(currentIndex - 1);
      if (event.key === 'ArrowRight') showPhoto(currentIndex + 1);
    });

    // BASIC TOUCH SWIPE SUPPORT

    let touchStartX = 0;

    lightbox.addEventListener('touchstart', event => {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    lightbox.addEventListener('touchend', event => {
      const difference =
        event.changedTouches[0].screenX - touchStartX;

      if (Math.abs(difference) < 60) return;

      showPhoto(currentIndex + (difference < 0 ? 1 : -1));
    }, { passive: true });

    updateCount();
  </script>
