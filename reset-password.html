<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe | CCG</title>
  <link rel="stylesheet" href="admi.css">
  <link rel="stylesheet" href="auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <main class="auth-card" aria-labelledby="reset-title">
    <a class="auth-brand" href="index.html" aria-label="Retour au site CCG">
      <img src="CCG L.jpeg" alt="Logo CCG">
      <span>CCG ADMIN</span>
    </a>
    <h1 id="reset-title">Mot de passe oublié</h1>
    <p id="reset-intro" class="auth-intro">Un lien sécurisé sera envoyé à l’adresse d’administration CCG.</p>
    <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
    <form id="reset-request-form" class="auth-form">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" value="ccdughana@gmail.com" autocomplete="email" readonly required>
      <button type="submit">Envoyer le lien</button>
    </form>
    <form id="reset-update-form" class="auth-form" hidden>
      <label for="new-password">Nouveau mot de passe</label>
      <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Enregistrer le mot de passe</button>
    </form>
    <a class="auth-link" href="login.html">Retour à la connexion</a>
  </main>
  <script src="supabsae-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</body>
</html>
