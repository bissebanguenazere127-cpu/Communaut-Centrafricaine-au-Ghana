<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCG | Members Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card reveal">
        <p class="eyebrow">Members area</p>
        <h1>Welcome back</h1>
        <p>Sign in to access member resources, events, and updates.</p>
        <form class="auth-form">
          <label>
            Email
            <input type="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" placeholder="Enter your password" required />
          </label>
          <button class="btn btn-primary" type="submit">Login</button>
        </form>
        <a class="text-link" href="indexd.html">Back to the homepage</a>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
