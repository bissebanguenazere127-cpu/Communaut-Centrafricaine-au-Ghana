<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion administration | CCG</title>
  <link rel="stylesheet" href="admi.css">
  <link rel="stylesheet" href="auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-body">
  <main class="auth-card" aria-labelledby="login-title">
    <a class="auth-brand" href="index.html" aria-label="Retour au site CCG">
      <img src="CCG L.jpeg" alt="Logo CCG">
      <span>CCG ADMIN</span>
    </a>
    <h1 id="login-title">Espace administration</h1>
    <p class="auth-intro">Connectez-vous avec votre compte administrateur.</p>
    <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
    <form id="login-form" class="auth-form">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
    </form>
    <a class="auth-link" href="reset-password.html">Mot de passe oublié ?</a>
  </main>
  <script src="supabsae-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</body>
</html>
